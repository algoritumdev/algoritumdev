# Genera la serpiente que se come el gráfico de contribuciones y la publica
# en la rama "output". El README la lee desde ahí.
#
# Corre sola una vez por día. También se puede disparar a mano desde la
# pestaña Actions, que es lo que conviene hacer la primera vez.
name: serpiente

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Dibujar la serpiente
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Colores de ALGORITUM: la serpiente en azul de marca y los
          # cuadraditos del gris del fondo hasta el azul pleno.
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#1683E8&color_dots=#0B0D10,#12314C,#164A78,#1268B8,#1683E8

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
